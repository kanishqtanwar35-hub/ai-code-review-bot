name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: read the code, write PR comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

# A new push supersedes the previous review — cancel the old run rather than
# posting two contradictory reviews on the same PR.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Forked PRs get a read-only token, so the post would fail. Skip cleanly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Review the diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python review.py
